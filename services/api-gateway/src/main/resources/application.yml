        []

shoppulse:
  jwt:
    # Must match auth-service. TODO Block 1 (V2): move both to Vault.
    secret: local-dev-only-secret-please-move-me-to-vault-0123456789

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  tracing:
    sampling:
      probability: 1.0   # trace everything locally; prod uses ~0.1
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
