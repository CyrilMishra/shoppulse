apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app: product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  strategy:
    type: RollingUpdate        # the default — this IS "rolling deployment"
    rollingUpdate:
      maxSurge: 1              # 1 extra pod during rollout
      maxUnavailable: 0        # never drop below desired count = zero downtime
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: shoppulse/product-service:0.1
          imagePullPolicy: IfNotPresent   # kind-loaded image, don't pull
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: product-service-config
          # TODO Block 4: add a Secret for the DB password and reference it here
          #   kubectl create secret generic product-db --from-literal=SPRING_DATASOURCE_PASSWORD=shoppulse
          resources:
            requests:            # scheduler uses these to place the pod
              cpu: 250m
              memory: 512Mi
            limits:              # TODO: what happens when each is exceeded?
              cpu: "1"           #   cpu -> throttled; memory -> OOMKilled. Verify!
              memory: 768Mi
          # TODO Block 4: probes — Spring exposes both endpoints when
          # management.endpoint.health.probes.enabled=true (on by default in K8s)
          livenessProbe:         # fails -> container RESTARTED
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:        # fails -> pod removed from Service endpoints (no restart)
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 5
