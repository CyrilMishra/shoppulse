// Root build — intentionally minimal. Each service under services/ is a
// self-contained Spring Boot app with its own build.gradle so you can see
// exactly which dependencies each concern needs (that's the point of this repo).
//
// Useful commands:
//   ./gradlew projects                          — list all modules
//   ./gradlew :services:eureka-server:bootRun   — run one service
//   ./gradlew build -x test                     — compile everything

subprojects {
    group = 'com.shoppulse'
    version = '0.1.0'
}
