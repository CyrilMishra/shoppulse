# ShopPulse local infrastructure.
#
# Everything is free and runs locally. Services are grouped with COMPOSE PROFILES
# so you never run more than your RAM needs:
#
#   docker compose up -d                                  -> core: mysql, mongo, redis, kafka(+ui), vault
#   docker compose --profile search up -d                 -> + elasticsearch
#   docker compose --profile cdc up -d                    -> + debezium (kafka connect)
#   docker compose --profile ai up -d                     -> + qdrant, langfuse
#   docker compose --profile obs up -d                    -> + prometheus, grafana, zipkin
#   docker compose --profile aws up -d                    -> + localstack (SQS), dynamodb-local
#   docker compose --profile search --profile cdc --profile ai --profile obs --profile aws up -d   -> everything (~10-12 GB RAM)
#
#   docker compose down          -> stop (data volumes kept)
#   docker compose down -v       -> stop AND wipe all data
#
# Production parity notes are at the bottom of this file.

name: shoppulse

services:

  # ────────────────────────── CORE (default profile) ──────────────────────────

  mysql:
    image: mysql:8.0
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: shoppulse
      MYSQL_DATABASE: productdb
    # ROW binlog format + binlog enabled = what Debezium reads. This is how CDC
    # works in production too: Debezium tails the MySQL binlog like a replica.
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pshoppulse"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # Single-node Kafka in KRaft mode (no ZooKeeper — know why for interviews:
  # KRaft replaced ZK for metadata consensus using Kafka's own raft quorum).
  # Two listeners: 19092 for containers on this network, 9092 for your host apps.
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:29093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: [kafka-data:/var/lib/kafka/data]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: shoppulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on: [kafka]

  # Dev mode: in-memory, auto-unsealed, root token fixed. Production runs an HA
  # cluster with raft storage, auto-unseal via cloud KMS, and short-lived tokens.
  vault:
    image: hashicorp/vault:1.17
    ports: ["8200:8200"]
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: shoppulse-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

  # ────────────────────────── profile: cdc ──────────────────────────

  # Kafka Connect with Debezium plugins. Register the MySQL connector with:
  #   curl -X POST -H "Content-Type: application/json" \
  #     --data @infra/debezium/register-products-connector.json http://localhost:8383/connectors
  debezium:
    image: quay.io/debezium/connect:2.7
    profiles: [cdc]
    ports: ["8383:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
    depends_on: [kafka, mysql]

  # ────────────────────────── profile: search ──────────────────────────

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    profiles: [search]
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [es-data:/usr/share/elasticsearch/data]

  # ────────────────────────── profile: ai ──────────────────────────

  qdrant:
    image: qdrant/qdrant:latest
    profiles: [ai]
    ports: ["6333:6333", "6334:6334"]   # 6333 REST + dashboard, 6334 gRPC
    volumes: [qdrant-data:/qdrant/storage]

  langfuse-db:
    image: postgres:16-alpine
    profiles: [ai]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes: [langfuse-pg:/var/lib/postgresql/data]

  # LLM observability. UI at http://localhost:3002 — sign up locally, create a
  # project, copy the public/secret keys into your .env.
  langfuse:
    image: langfuse/langfuse:2
    profiles: [ai]
    ports: ["3002:3000"]
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3002
      NEXTAUTH_SECRET: local-dev-secret-change-me
      SALT: local-dev-salt-change-me
      TELEMETRY_ENABLED: "false"
    depends_on: [langfuse-db]

  # ────────────────────────── profile: obs ──────────────────────────

  prometheus:
    image: prom/prometheus:latest
    profiles: [obs]
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    profiles: [obs]
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro

  zipkin:
    image: openzipkin/zipkin:latest
    profiles: [obs]
    ports: ["9411:9411"]

  # ────────────────────────── profile: aws ──────────────────────────

  # Free local AWS emulator. Create your queue with:
  #   docker compose exec localstack awslocal sqs create-queue --queue-name payment-retry
  localstack:
    image: localstack/localstack:latest
    profiles: [aws]
    ports: ["4566:4566"]
    environment:
      SERVICES: sqs

  dynamodb:
    image: amazon/dynamodb-local:latest
    profiles: [aws]
    ports: ["8002:8000"]
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"

volumes:
  mysql-data:
  mongo-data:
  kafka-data:
  es-data:
  qdrant-data:
  langfuse-pg:

# ─────────────────────── PRODUCTION PARITY (interview gold) ───────────────────────
# local                          -> production equivalent
# single kafka broker            -> 3+ brokers, replication.factor=3, min.insync.replicas=2
# vault dev mode                 -> HA Vault cluster, raft/consul storage, KMS auto-unseal, AppRole auth
# debezium standalone connect    -> Kafka Connect cluster (distributed mode) or Debezium Server
# elasticsearch single node      -> 3+ node cluster, dedicated masters, ILM policies
# localstack SQS                 -> real AWS SQS (same SDK code — only the endpoint changes)
# dynamodb-local                 -> DynamoDB (provisioned/on-demand capacity, DAX cache)
# docker compose                 -> Kubernetes (EKS/GKE) + Helm charts + ArgoCD (GitOps)
# langfuse:2 + postgres          -> Langfuse cloud or v3 (adds clickhouse + redis + s3)
# ollama on your laptop          -> Bedrock / OpenAI / Anthropic APIs behind a gateway with quotas
