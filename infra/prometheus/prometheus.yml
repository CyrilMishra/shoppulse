# Prometheus PULLS metrics (scrape model) — services just expose /actuator/prometheus.
# Interview point: pull vs push (Prometheus pulls; StatsD/CloudWatch push; pull makes
# "target down" detection trivial via the `up` metric).
#
# Your Spring services run on the HOST (gradle bootRun), Prometheus runs in Docker,
# so targets use host.docker.internal.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: shoppulse-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080   # api-gateway
          - host.docker.internal:8081   # auth-service
          - host.docker.internal:8082   # product-service
          - host.docker.internal:8083   # order-service
          - host.docker.internal:8084   # inventory-service
          - host.docker.internal:8085   # payment-service
          - host.docker.internal:8086   # notification-service
          - host.docker.internal:8761   # eureka-server
        labels:
          env: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
